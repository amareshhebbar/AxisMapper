
model:
  name: "unsloth/Qwen2.5-7B-Instruct"
  max_seq_length: 512
  load_in_4bit: true   
  dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: 
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_dora: true        
  use_gradient_checkpointing: "unsloth"
  random_state: 42

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  
  learning_rate: 1e-4   
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  optim: "paged_adamw_8bit"
  bf16: true
  gradient_checkpointing: true
  max_seq_length: 512
  eval_strategy: "steps"
  eval_steps: 200
  save_steps: 500
  save_total_limit: 3
  logging_steps: 10
  report_to: "wandb"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"